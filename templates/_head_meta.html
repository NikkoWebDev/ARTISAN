{# Metadatos comunes del <head>. Variables opcionales: seo_desc, seo_image, seo_type, seo_noindex #}
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
<meta name="theme-color" content="#1A1A18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
{% if seo_noindex %}
<meta name="robots" content="noindex, nofollow">
{% else %}
{% set _url = site_url() ~ request.path %}
{% set _img = site_url() ~ (seo_image or url_for('static', filename='img/IMG_20260121_150438.webp')) %}
<link rel="canonical" href="{{ _url }}">
<meta property="og:site_name" content="ARTISAN Studio San Agustín">
<meta property="og:locale" content="es_CO">
<meta property="og:type" content="{{ seo_type or 'website' }}">
<meta property="og:title" content="{{ seo_title }}">
<meta property="og:description" content="{{ seo_desc }}">
<meta property="og:url" content="{{ _url }}">
<meta property="og:image" content="{{ _img }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo_title }}">
<meta name="twitter:description" content="{{ seo_desc }}">
<meta name="twitter:image" content="{{ _img }}">
{% endif %}
