<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artisan - Textilería</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- CABECERA -->
    <header class="cabecera">
        <div class="zona-logo">
            <a href="../../../index.html" class="logo-texto">ARTISAN</a>
        </div>
        <nav class="zona-menu">
            <ul>
                <li><a href="../../../index.html">Inicio</a></li>
                <li><a href="../../../lineaproductos.html">Linea de productos</a></li>
                <li><a href="../../../contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="zona-carrito">
            <a href="../../../carrito.html">
                <img src="../../../img/diseño/carrito.png" class="icono-carrito" alt="Carrito">
            </a>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido-principal">
        <section class="productos-destacados">
            <div class="contenedor">
                <h2>Textilería</h2>
                <p>Explora nuestra colección de ruanas, ponchos y bufandas artesanales.</p>

                <div class="grilla-productos" id="grilla-productos">
                    <!-- Productos se generarán dinámicamente desde JS -->
                </div>
            </div>
        </section>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="pie-pagina">
        <div class="contenedor">
            <p>&copy; 2025 Artisan. Todos los derechos reservados.</p>
            <p>Contacto: <a href="mailto:contacto@artisan.com">contacto@artisan.com</a></p>
            <div class="redes">
                <a href="https://www.instagram.com" target="_blank">Instagram</a> |
                <a href="https://www.facebook.com" target="_blank">Facebook</a>
            </div>
        </div>
    </footer>

    <!-- JS -->
    <script src="../../../js/main.js"></script>
    <script src="../../../js/productos.js"></script> <!-- JSON de productos -->
    <script>
        // Generar productos dinámicamente
        const contenedor = document.getElementById("grilla-productos");
        const categoria = "textileria"; // Categoría de esta página

        for (const id in productos[categoria]) {
            const p = productos[categoria][id];
            const div = document.createElement("div");
            div.className = "producto";
            div.innerHTML = `
                <h3>${p.nombre}</h3>
                <img src="${p.imagenes[0]}" alt="${p.nombre}">
                <p>${p.descripcionCorta}</p>
                <a href="producto.html?categoria=${categoria}&producto=${id}" class="boton-ver">Ver</a>
                <button onclick="agregarAlCarrito('${p.nombre}', ${p.precio}, '${p.imagenes[0]}')" class="boton-comprar">Comprar</button>
            `;
            contenedor.appendChild(div);
        }
    </script>

    <div id="loader" class="loader-ventana">
        <div class="loader-contenido">
            <h2>Textilería</h2>
        </div>
    </div>
</body>
</html>
