<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artisan - Producto</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- CABECERA -->
    <header class="cabecera">
        <div class="zona-logo">
            <a href="index.html" class="logo-texto">ARTISAN</a>
        </div>
        <nav class="zona-menu">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="lineaproductos.html">Linea de productos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="zona-carrito">
            <a href="carrito.html">
                <img src="img/diseño/carrito.png" class="icono-carrito" alt="Carrito">
            </a>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido-principal">
        <section class="producto-contenedor contenedor">

            <!-- DETALLE DEL PRODUCTO -->
            <div class="producto-detalle">

                <!-- GALERÍA -->
                <div class="galeria-principal">
                    <img id="imagen-principal" src="" alt="Imagen principal" class="imagen-principal">
                    <div id="miniaturas" class="miniaturas">
                        <!-- Miniaturas dinámicas -->
                    </div>
                </div>

                <!-- INFORMACIÓN DEL PRODUCTO -->
                <div class="info-producto">
                    <h2 id="producto-nombre"></h2>
                    <p id="producto-descripcion"></p>
                    <p id="producto-precio" class="precio"></p>

                    <!-- BOTONES -->
                    <div class="botones-accion" style="display:flex; gap:15px; margin-bottom:20px;">
                        <button class="boton-comprar" onclick="enviarWhatsApp()">Comprar</button>
                        <button class="boton-comprar" onclick="agregarAlCarritoActual()">Añadir al carrito</button>
                    </div>

                    <!-- ACORDEONES -->
                    <details class="acordeon">
                        <summary>Origen</summary>
                        <p id="producto-origen"></p>
                    </details>

                    <details class="acordeon">
                        <summary>Dimensiones</summary>
                        <p id="producto-dimensiones"></p>
                    </details>

                    <details class="acordeon">
                        <summary>Características</summary>
                        <ul id="producto-caracteristicas">
                            <!-- Características dinámicas -->
                        </ul>
                    </details>

                </div>
            </div>

            <!-- OTRAS VARIANTES -->
            <div class="variantes">
                <h3>Otras opciones</h3>
                <div id="producto-variantes" class="variantes-grilla">
                    <!-- Variantes cargadas dinámicamente -->
                </div>
            </div>

        </section>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="pie-pagina">
        <div class="contenedor">
            <p>&copy; 2025 Artisan. Todos los derechos reservados.</p>
            <p>Contacto: <a href="mailto:contacto@artisan.com">contacto@artisan.com</a></p>
        </div>
    </footer>

    <!-- JS -->
    <script src="js/main.js"></script>
    <script src="js/producto.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            cargarProducto();
        });
    </script>

</body>
</html>
