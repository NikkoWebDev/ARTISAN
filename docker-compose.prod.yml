version: '3.8'

services:
  db:
    image: postgres:15
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "5000:5000"
    env_file:
      - .env.docker
    volumes:
      - ./static/img/productos:/app/static/img/productos
      - ./logs:/app/logs
    depends_on:
      - db
    restart: unless-stopped

volumes:
  logs:
  postgres_data:

networks:
  default:
    driver: bridge
