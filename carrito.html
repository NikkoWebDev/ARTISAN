<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artisan - Carrito</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>

    <header class="cabecera">
        <div class="zona-logo">
            <a href="index.html" class="logo-texto">ARTISAN</a>
        </div>

        <nav class="zona-menu">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="lineaproductos.html">Linea de productos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

        <div class="zona-carrito">
            <a href="carrito.html">
                <img src="img/diseño/carrito.png" class="icono-carrito" alt="Carrito">
            </a>
        </div>
    </header>

    <main class="contenido-principal">

        <section class="carrito-contenedor">

            <h2 class="carrito-titulo">Tu Carrito</h2>

            <p class="carrito-advertencia" style="color: #60611b; font-size: 0.9rem; margin-bottom: 15px;">
                NOTA: El carrito solo se guarda en este navegador. Si cambias de dispositivo o borras el historial, los productos se perderán.
            </p>

            <!-- Lista del carrito -->
            <div id="carrito-lista" class="carrito-lista"></div>

            <!-- Total y botón de pagar -->
            <div class="carrito-total">
                <p id="carrito-total">Total: $0 COP</p>

                <button class="boton-pagar" onclick="pagarWhatsApp()">
                    Pagar por WhatsApp
                </button>
            </div>

        </section>
    </main>

    <footer class="pie-pagina">
        <div class="contenedor">
            <p>&copy; 2025 Artisan. Todos los derechos reservados.</p>
            <p>Contacto: <a href="mailto:contacto@artisan.com">contacto@artisan.com</a></p>
        </div>
    </footer>

    <!-- ================================
         MODAL UNIVERSAL
    ================================== -->
    <div id="modalNotificacion" class="modal-overlay" style="display:none;">
        <div class="modal-caja">
            <p id="modalMensaje"></p>
            <button id="modalCerrar" class="modal-boton">Cerrar</button>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
